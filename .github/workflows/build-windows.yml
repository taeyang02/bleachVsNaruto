name: Build Windows (SHELL_Pc)

on:
  workflow_dispatch:
    inputs:
      tag_assets:
        description: 'BleachVsNaruto_TagAssets tag (binary assets)'
        required: true
        default: '3.7.0.0.12212024_alpha'
      package_target:
        description: 'bundle = playable Windows zip | air = .air installer | swf = compile only'
        required: true
        default: 'bundle'
        type: choice
        options:
          - bundle
          - air
          - swf
  push:
    branches: [main, master, build-windows]
    paths:
      - 'SHELL_Pc/**'
      - 'CORE_*/**'
      - 'LIB_KyoLib/**'
      - 'shared/**'
      - 'tools/ci/**'
      - '.github/workflows/build-windows.yml'

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows AIR build
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      FLEX_SDK_NAME: flex4.16.1-air51.0.1.1
      FLEX_SDK_URL: https://github.com/5DPLAY-Game-Studio/BleachVsNaruto_FlexSDK/releases/download/flex4.16.1-air51.0.1.1/flex4.16.1-air51.0.1.1.rar
      TAG_ASSETS_REPO: 5DPLAY-Game-Studio/BleachVsNaruto_TagAssets
      PACKAGE_TARGET: ${{ github.event.inputs.package_target || 'bundle' }}
      TAG_ASSETS: ${{ github.event.inputs.tag_assets || '3.7.0.0.12212024_alpha' }}
      # Older TagAssets still ship UI SWFs (common_ui.swf, …) needed for Embed + legacy linkage
      UI_TAG_ASSETS: '3.7.0.0.11112024_alpha'
      KERNEL_SWC_TAG: '3.7.0.0.11112024_alpha'
      KEYSTORE_PASS: ${{ secrets.AIR_KEYSTORE_PASSWORD || '123456' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install asconfigc
        run: npm install -g asconfigc

      - name: Cache Flex SDK
        id: cache-flex
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/flex-sdk
          key: flex-sdk-${{ env.FLEX_SDK_NAME }}-win-v2

      - name: Download & extract Flex/AIR SDK
        if: steps.cache-flex.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $flexRoot = Join-Path $env:RUNNER_TEMP 'flex-sdk'
          $extractDir = Join-Path $env:RUNNER_TEMP 'flex-sdk-extract'
          $rar = Join-Path $env:RUNNER_TEMP "$($env:FLEX_SDK_NAME).rar"

          if (Test-Path $flexRoot) { Remove-Item $flexRoot -Recurse -Force }
          if (Test-Path $extractDir) { Remove-Item $extractDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null

          Write-Host "Downloading Flex SDK..."
          Invoke-WebRequest -Uri $env:FLEX_SDK_URL -OutFile $rar

          choco install 7zip -y --no-progress
          & "C:\Program Files\7-Zip\7z.exe" x $rar "-o$extractDir" -y
          if ($LASTEXITCODE -ne 0) { throw "7z extract failed: $LASTEXITCODE" }

          # Find real SDK root (folder that contains bin\adt.bat)
          $adt = Get-ChildItem -Path $extractDir -Recurse -Filter 'adt.bat' -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq 'bin' } |
            Select-Object -First 1
          if (-not $adt) {
            Get-ChildItem $extractDir | Format-Table Name
            throw 'adt.bat not found after Flex SDK extract'
          }
          $sdkHome = $adt.Directory.Parent.FullName
          Write-Host "Detected SDK at: $sdkHome"

          New-Item -ItemType Directory -Force -Path $flexRoot | Out-Null
          Copy-Item -Path (Join-Path $sdkHome '*') -Destination $flexRoot -Recurse -Force

          if (-not (Test-Path (Join-Path $flexRoot 'bin\adt.bat'))) {
            throw "FLEX_HOME incomplete: $flexRoot"
          }
          Write-Host "Flex SDK ready: $flexRoot"

      - name: Set FLEX_HOME
        shell: pwsh
        run: |
          $flex = Join-Path $env:RUNNER_TEMP 'flex-sdk'
          if (-not (Test-Path (Join-Path $flex 'bin\adt.bat'))) {
            throw "FLEX_HOME missing adt.bat: $flex"
          }
          "FLEX_HOME=$flex" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "FLEX_HOME=$flex"

      - name: Fetch LIB_KyoLib
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'LIB_KyoLib\asconfig.json') {
            Write-Host 'LIB_KyoLib already present'
            exit 0
          }

          # Repo often has empty LIB_KyoLib dir without gitlink; clone directly.
          if (Test-Path 'LIB_KyoLib') {
            Remove-Item 'LIB_KyoLib' -Recurse -Force
          }

          $url = 'https://github.com/5DPLAY-Game-Studio/LIB_KyoLib.git'
          Write-Host "Cloning $url ..."
          git clone --depth 1 $url LIB_KyoLib
          if (-not (Test-Path 'LIB_KyoLib\asconfig.json')) {
            throw 'LIB_KyoLib clone failed (asconfig.json missing)'
          }
          Write-Host 'LIB_KyoLib OK'

      - name: Fetch TagAssets and overlay shared/
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:TAG_ASSETS
          $zip = Join-Path $env:RUNNER_TEMP "TagAssets-$tag.zip"
          $url = "https://github.com/$($env:TAG_ASSETS_REPO)/archive/refs/tags/$tag.zip"
          Write-Host "Downloading TagAssets $tag ..."
          Invoke-WebRequest -Uri $url -OutFile $zip

          $extract = Join-Path $env:RUNNER_TEMP "TagAssets-$tag"
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $extract -Force

          $inner = Get-ChildItem $extract -Directory | Select-Object -First 1
          $srcShared = Join-Path $inner.FullName 'shared'
          if (-not (Test-Path $srcShared)) {
            throw "TagAssets missing shared/ (tag=$tag)"
          }
          Write-Host "Overlay $srcShared -> ./shared"
          Copy-Item -Path (Join-Path $srcShared '*') -Destination 'shared' -Recurse -Force

          if (-not (Test-Path 'shared\assets\assets\config')) {
            throw 'TagAssets overlay failed: shared/assets/assets/config missing'
          }

      - name: Build playable Windows package
        shell: pwsh
        run: |
          ./tools/ci/build-windows.ps1 -PackageTarget $env:PACKAGE_TARGET -KeystorePass $env:KEYSTORE_PASS

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: bleachvsnaruto-windows-${{ github.sha }}
          path: |
            dist/**
            out/production/SHELL_Pc/launch.swf
          if-no-files-found: error
          retention-days: 14
